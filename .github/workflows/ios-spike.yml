name: iOS feasibility spike

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  gluonfx-maven-ios:
    name: GluonFX Maven / JavaFX iOS simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Select newest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Toolchain versions
        run: |
          java -version
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build JavaFX iOS application with GluonFX Maven
        working-directory: ci/ios-hello
        run: mvn -B -e -Dgluonfx.target=ios gluonfx:build gluonfx:link
      - name: Package unsigned app as IPA
        working-directory: ci/ios-hello
        run: |
          APP=$(find target -name '*.app' -type d -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/HelloApp.app"
          cd "$RUNNER_TEMP"
          zip -qry HelloApp-unsigned.ipa Payload
          unzip -t HelloApp-unsigned.ipa
      - name: Upload app and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-feasibility-spike
          path: |
            ci/ios-hello/target/**/*.log
            ci/ios-hello/target/**/*.txt
            ${{ runner.temp }}/HelloApp-unsigned.ipa
