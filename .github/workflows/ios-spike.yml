name: iOS feasibility spike

# Builds the two feasibility apps for iOS with GluonFX/GraalVM on macOS runners and
# produces an *unsigned* .ipa with a SHA-256 checksum. Nothing here is signed with an
# Apple identity and nothing here can be installed without re-signing.
#
# GluonFX 1.0.25 (Substrate 0.0.65) is pinned deliberately: Substrate 0.0.66+ stopped
# shipping RISCV64LibCHelperDirectives.cap in its iOS CAP cache, so native-image aborts
# with "Could not load CAPCache file" unless the cache is patched by hand. 1.0.25 is the
# newest plugin whose shipped CAP cache is complete, and it does build and package iOS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain-java 1.0.25
            slug: ios-shell-1.0.25
            module: ci/ios-shell
            plugin: '1.0.25'
            app: BlueJShell
            selftest: true
            runner: macos-15-intel
          - name: javafx 1.0.25
            slug: ios-hello-1.0.25
            module: ci/ios-hello
            plugin: '1.0.25'
            app: HelloApp
            selftest: false
            runner: macos-15-intel
          - name: javafx 1.0.25 arm64 host
            slug: ios-hello-1.0.25-arm64host
            module: ci/ios-hello
            plugin: '1.0.25'
            app: HelloApp
            selftest: false
            arch: aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          arch: ${{ matrix.arch || 'x86_64' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain versions
        run: |
          java -version
          echo "GRAALVM_HOME=${GRAALVM_HOME:-$JAVA_HOME}" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m

      - name: Install interpreted runtime module
        run: mvn -B -e -f spike-java/pom.xml install -Dmaven.test.skip=true

      - name: Host self-test of the iOS shell entry point
        if: matrix.selftest
        run: bash ci/ios-shell/tools/selftest-host.sh

      - name: GluonFX native build for iOS
        working-directory: ${{ matrix.module }}
        run: |
          set -o pipefail
          mvn -B -e -Pios -Dgluonfx.version=${{ matrix.plugin }} gluonfx:build 2>&1 | tee /tmp/gluonfx-build.log

      # Substrate can refuse to finish packaging when no Apple signing identity is
      # configured. The bundle is assembled before signing, so a failure here is not
      # fatal: the next step turns whatever .app exists into an unsigned .ipa.
      - name: GluonFX package unsigned IPA
        id: package
        continue-on-error: true
        working-directory: ${{ matrix.module }}
        run: |
          set -o pipefail
          mvn -B -e -Pios -Dgluonfx.version=${{ matrix.plugin }} gluonfx:package 2>&1 | tee -a /tmp/gluonfx-build.log

      - name: Assemble and verify the unsigned IPA
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          echo "gluonfx:package outcome: ${{ steps.package.outcome }}"
          find target/gluonfx -maxdepth 4 \( -name '*.app' -o -name '*.ipa' \) -print

          OUT="${{ runner.temp }}/${{ matrix.app }}-unsigned.ipa"
          IPA=$(find target/gluonfx -name '*.ipa' -type f -print -quit || true)
          if [ -n "${IPA:-}" ]; then
            echo "using the .ipa produced by gluonfx:package: $IPA"
            cp "$IPA" "$OUT"
          else
            APP=$(find target/gluonfx -name '*.app' -type d -print -quit || true)
            echo "no .ipa produced; assembling one from: ${APP:-<none>}"
            test -n "${APP:-}"
            test -f "$APP/Info.plist"
            rm -rf "${{ runner.temp }}/Payload"
            mkdir -p "${{ runner.temp }}/Payload"
            cp -R "$APP" "${{ runner.temp }}/Payload/${{ matrix.app }}.app"
            (cd "${{ runner.temp }}" && zip -qry "${{ matrix.app }}-unsigned.ipa" Payload)
          fi

          unzip -l "$OUT" | head -30
          shasum -a 256 "$OUT" | tee "${{ runner.temp }}/${{ matrix.app }}-unsigned.ipa.sha256"

      - name: Verify the IPA is an arm64 iOS bundle
        run: |
          set -euo pipefail
          python3 ci/tools/verify-ipa.py \
            "${{ runner.temp }}/${{ matrix.app }}-unsigned.ipa" \
            "${{ runner.temp }}/${{ matrix.app }}-unsigned.ipa.sha256" \
            | tee "${{ runner.temp }}/verify-ipa.txt"
          APP=$(find "${{ matrix.module }}/target/gluonfx" -name '*.app' -type d -print -quit || true)
          if [ -n "${APP:-}" ]; then
            BIN="$APP/$(plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>/dev/null || echo "${{ matrix.app }}")"
            echo "app binary: $BIN"
            file "$BIN" || true
            lipo -archs "$BIN" || true
          fi

      - name: Upload app, IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          if-no-files-found: warn
          path: |
            ${{ matrix.module }}/target/gluonfx
            /tmp/gluonfx-build.log
            ${{ runner.temp }}/*.ipa
            ${{ runner.temp }}/*.sha256
            ${{ runner.temp }}/verify-ipa.txt
