name: iOS feasibility spike

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain-java 1.0.25
            slug: ios-shell-1.0.25
            module: ci/ios-shell
            plugin: '1.0.25'
            app: BlueJShell
            selftest: true
            runner: macos-15-intel
          - name: javafx 1.0.25
            slug: ios-hello-1.0.25
            module: ci/ios-hello
            plugin: '1.0.25'
            app: HelloApp
            selftest: false
            runner: macos-15-intel
          - name: plain-java 1.0.28 + cap override
            slug: ios-shell-1.0.28-capoverride
            module: ci/ios-shell
            plugin: '1.0.28'
            substrate: '0.0.68'
            app: BlueJShell
            selftest: true
            capoverride: true
            runner: macos-15-intel
          - name: javafx 1.0.25 arm64 host
            slug: ios-hello-1.0.25-arm64host
            module: ci/ios-hello
            plugin: '1.0.25'
            app: HelloApp
            selftest: false
            arch: aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          arch: ${{ matrix.arch || 'x86_64' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain versions
        run: |
          java -version
          echo "GRAALVM_HOME=${GRAALVM_HOME:-$JAVA_HOME}" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m

      - name: Install interpreted runtime module
        run: mvn -B -e -f spike-java/pom.xml install -Dmaven.test.skip=true

      - name: Host self-test of the iOS shell entry point
        if: matrix.selftest
        run: bash ci/ios-shell/tools/selftest-host.sh

      - name: Extract a complete iOS CAP cache from the substrate jar
        if: matrix.capoverride
        run: |
          set -euo pipefail
          SUB=${{ matrix.substrate }}
          curl -sSL --fail -o /tmp/substrate.jar \
            "https://repo1.maven.org/maven2/com/gluonhq/substrate/$SUB/substrate-$SUB.jar"
          mkdir -p "${{ matrix.module }}/target/capcache-ios"
          (cd /tmp && unzip -o -j substrate.jar 'native/ios/cap/*.cap' \
            -d "$GITHUB_WORKSPACE/${{ matrix.module }}/target/capcache-ios")
          ls -l "${{ matrix.module }}/target/capcache-ios"

      - name: GluonFX native build for iOS
        working-directory: ${{ matrix.module }}
        run: |
          set -o pipefail
          mvn -B -e -Pios ${{ matrix.capoverride && '-Pcapcache-override' || '' }} \
            -Dgluonfx.version=${{ matrix.plugin }} gluonfx:build 2>&1 | tee /tmp/gluonfx-build.log

      - name: Package unsigned IPA
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          APP=$(find target/gluonfx -name '*.app' -type d -print -quit)
          echo "APP=$APP"
          test -n "$APP"
          BIN=$(find "$APP" -maxdepth 1 -type f -perm -u+x | head -1)
          echo "app binary: $BIN"
          file "$BIN" || true
          lipo -archs "$BIN" || true
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/${{ matrix.app }}.app"
          cd "$RUNNER_TEMP"
          zip -qry "${{ matrix.app }}-unsigned.ipa" Payload
          unzip -t "${{ matrix.app }}-unsigned.ipa"
          shasum -a 256 "${{ matrix.app }}-unsigned.ipa" | tee "${{ matrix.app }}-unsigned.ipa.sha256"

      - name: Upload app, IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          if-no-files-found: warn
          path: |
            ${{ matrix.module }}/target/gluonfx
            /tmp/gluonfx-build.log
            ${{ runner.temp }}/*.ipa
            ${{ runner.temp }}/*.sha256
