name: BlueJ iPad app

# Builds the SwiftUI app, runs the Swift model tests, and drives the app in an iPad
# simulator with XCUITest against the real Java core (compiled by Maven, served over
# loopback HTTP). Screenshots from each step are kept as artifacts. Nothing is signed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit-tests:
    name: Swift model and protocol tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test BlueJPadKit
        working-directory: app/BlueJPadKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/kit-tests.log

  app-simulator:
    name: iPad simulator UI tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the Java core
        run: |
          set -o pipefail
          mvn -B -q -f spike-java/pom.xml install -DskipTests 2>&1 | tee /tmp/core-build.log
          mvn -B -q -f core-server/pom.xml package -DskipTests 2>&1 | tee -a /tmp/core-build.log

      - name: Start the core server
        run: |
          set -euo pipefail
          JAR=core-server/target/core-server-0.1.0-SNAPSHOT.jar
          test -f "$JAR"
          nohup java -jar "$JAR" --port 8899 > /tmp/core.log 2>&1 &
          echo $! > /tmp/core.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8899/health > /tmp/health.json 2>/dev/null; then
              echo "core is up: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 1
          done
          echo "core did not start" >&2
          cat /tmp/core.log >&2
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: app
        run: |
          xcodegen generate
          xcodebuild -version

      - name: Choose an iPad simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E "^ +iPad" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using iPad simulator $UDID"

      - name: Build and run the UI tests
        working-directory: app
        env:
          BLUEJ_CORE_URL: http://127.0.0.1:8899
        run: |
          set -o pipefail
          xcodebuild test \
            -project BlueJPad.xcodeproj \
            -scheme BlueJPad \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/BlueJPad.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/BlueJPad.xcresult" \
            --output-path "$RUNNER_TEMP/screenshots" || true
          find "$RUNNER_TEMP/screenshots" -type f | head -40

      - name: Simulator and core logs on failure
        if: failure()
        run: |
          echo "== core =="
          tail -200 /tmp/core.log || true
          echo "== xcodebuild =="
          grep -E "error:|failed|Failed|Assertion" /tmp/xcodebuild.log | tail -80 || true

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-simulator-results
          if-no-files-found: warn
          path: |
            /tmp/xcodebuild.log
            /tmp/core.log
            /tmp/core-build.log
            ${{ runner.temp }}/BlueJPad.xcresult
            ${{ runner.temp }}/screenshots
