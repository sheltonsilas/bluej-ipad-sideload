name: Java feasibility tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run ECJ and interpreter proofs
        run: mvn -B -f spike-java/pom.xml test

      - name: Run the iOS shell entry point on the host JVM
        run: bash ci/ios-shell/tools/selftest-host.sh
